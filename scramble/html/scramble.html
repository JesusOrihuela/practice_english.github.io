    <main class="scramble-page" id="main-content">


        <!-- Topic Picker -->
        <div id="topic-picker">
            <div class="scramble-header">
                <h1 data-i18n-html="scramble_page_title"></h1>
                <p data-i18n="scramble_picker_sub"></p>
            </div>
            <div class="topic-grid" id="topic-grid">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Exercise Area -->
        <div id="exercise-area" class="hidden">

            <!-- Session bar -->
            <div class="session-info-bar">
                <button class="back-btn" id="back-btn" data-i18n="back_to_topics"></button>
                <span id="scramble-counter" class="session-counter" role="status" aria-live="polite"></span>
                <span class="streak-badge" id="scramble-streak"></span>
            </div>
            <div class="session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="session-progress-fill" id="session-progress-fill"></div></div>

            <h1 class="scramble-title" data-i18n-html="scramble_title"></h1>
            <p class="scramble-subtitle" data-i18n="scramble_picker_sub"></p>

            <!-- Spanish hint -->
            <div class="hint-card" id="hint-card">
                <span class="hint-label" aria-label="Pista de traducción en español" data-i18n="hint_label" data-i18n-aria="hint_label_aria">Pista</span>
                <span class="hint-text" id="hint-text">—</span>
            </div>

            <!-- Construction area (where user builds the sentence) -->
            <div class="construction-zone">
                <div class="zone-label-row">
                    <p class="zone-label" data-i18n="zone_your_sentence">Tu oración</p>
                    <button class="clear-btn" id="clear-btn" aria-label="Borrar oración" data-i18n-aria="clear_sentence_aria">↩ Borrar</button>
                </div>
                <div class="construction-row">
                    <div class="construction-area" id="construction-area" role="region" aria-label="Built sentence" data-i18n-aria="construction_area_aria" aria-live="polite">
                        <span class="placeholder-text" id="placeholder" data-i18n="word_bank_prompt">Toca las palabras de abajo para empezar…</span>
                    </div>
                    <button class="check-btn" id="check-btn" data-i18n="btn_verify"></button>
                </div>
            </div>

            <!-- Word bank (scrambled tiles to pick from) -->
            <div class="word-bank-zone">
                <p class="zone-label" data-i18n="word_bank_label">Banco de palabras</p>
                <div class="word-bank" id="word-bank" role="group" aria-label="Available words" data-i18n-aria="word_bank_aria"></div>
            </div>


            <!-- Feedback -->
            <div class="scramble-feedback hidden" id="scramble-feedback" role="status" aria-live="polite">
                <p class="feedback-result" id="feedback-result"></p>
                <div id="scramble-diff"></div>
            </div>

            <!-- Grammar micro-tip chip (shown on correct answer, free mode only) -->
            <div id="grammar-chip-wrap" class="grammar-chip-wrap hidden">
                <a id="grammar-chip" class="grammar-chip" href="../../grammar/html/grammar.html" aria-label="Abrir Taller de Gramática para esta regla" data-i18n-aria="grammar_chip_aria">
                    📐 <span id="grammar-chip-label"></span> →
                </a>
            </div>

            <!-- Next / Try Again (shown after answer) -->
            <div class="action-row" id="action-row">
                <button class="next-btn hidden" id="next-btn" aria-label="Continuar a la siguiente frase" data-i18n-aria="next_btn_aria" data-i18n="btn_next"></button>
                <button class="try-again-btn hidden" id="try-again-btn" aria-label="Intentar esta frase de nuevo" data-i18n-aria="try_again_phrase_aria" data-i18n="btn_try_again"></button>
            </div>

        </div>

    </main>
