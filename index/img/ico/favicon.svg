<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Practice English">
  <style>
    .navy { fill: #1B2A80; }
    .globe-line { stroke: #1B2A80; }
    @media (prefers-color-scheme: dark) {
      .navy { fill: #4C6EF5; }
      .globe-line { stroke: #4C6EF5; }
    }
  </style>

  <!-- Thought cloud + trailing dot -->
  <g class="navy">
    <circle cx="15" cy="16" r="7"/>
    <circle cx="30" cy="16" r="7"/>
    <circle cx="22" cy="22" r="12"/>
    <circle cx="9" cy="35" r="3.2"/>
  </g>

  <!-- Globe inside the cloud -->
  <circle cx="22" cy="20" r="7.5" fill="#ffffff"/>
  <g class="globe-line" fill="none" stroke-width="1.3" stroke-linecap="round">
    <ellipse cx="22" cy="20" rx="3.2" ry="7.5"/>
    <line x1="14.7" y1="20" x2="29.3" y2="20"/>
  </g>

  <!-- Red speech bubble with a tail -->
  <path fill="#E1001E" d="M37 30 h13 a7.5 7.5 0 0 1 7.5 7.5 v8 a7.5 7.5 0 0 1 -7.5 7.5 h-8 l-6 6 1.2 -6 h-0.2 a7.5 7.5 0 0 1 -7.5 -7.5 v-8 a7.5 7.5 0 0 1 7.5 -7.5 z"/>

  <!-- 文 A -->
  <text x="42" y="47" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13"
        font-family="'Noto Sans CJK SC','Microsoft YaHei','Yu Gothic',sans-serif">文</text>
  <text x="51" y="50" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="11"
        font-family="'Segoe UI',Arial,sans-serif">A</text>
</svg>
