    <main class="translation-page" id="main-content">


        <!-- Topic Picker -->
        <div id="topic-picker">
            <div class="trans-header">
                <h1 data-i18n-html="translation_page_title"></h1>
                <p data-i18n="translation_picker_sub">Lee la frase en español y escribe la versión en inglés. La producción activa construye una memoria más sólida.</p>
            </div>
            <div class="topic-grid" id="topic-grid">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Exercise Area -->
        <div id="exercise-area" class="hidden">

            <!-- Session bar -->
            <div class="session-info-bar">
                <button class="back-btn" id="back-btn" data-i18n="back_to_topics"></button>
                <span id="trans-counter" class="session-counter" role="status" aria-live="polite"></span>
                <span class="streak-badge" id="trans-streak"></span>
            </div>
            <div class="session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="session-progress-fill" id="session-progress-fill"></div></div>

            <h1 class="trans-title"></h1>
            <p class="trans-subtitle"></p>

            <!-- Spanish phrase card -->
            <div class="phrase-card" id="phrase-card">
                <div class="lang-badge" id="lang-badge" aria-label="Spanish to English" data-i18n-aria="lang_badge_aria"></div>
                <div class="spanish-phrase" id="spanish-phrase">—</div>
            </div>

            <!-- Text input -->
            <div class="trans-input-row">
                <input type="text" id="trans-input"
                       placeholder="Escribe la frase en inglés…"
                       autocomplete="off" spellcheck="false" autocorrect="off"
                       aria-label="English translation"
                       data-i18n-aria="translation_input_aria"
                       data-i18n-placeholder="translation_input_ph">
                <button id="check-btn" class="check-btn" data-i18n="btn_verify"></button>
            </div>

            <!-- Feedback -->
            <div class="trans-feedback hidden" id="trans-feedback" role="status" aria-live="polite">
                <p class="feedback-result" id="feedback-result"></p>
                <div id="trans-diff"></div>
                <div class="feedback-divider hidden" id="feedback-divider"></div>
                <div class="feedback-note hidden" id="feedback-grammar-tip">
                    <span class="feedback-note-icon">💡</span>
                    <span class="feedback-note-text" id="feedback-grammar-tip-text"></span>
                </div>
                <div class="feedback-divider hidden" id="alt-note-divider"></div>
                <div class="alt-note hidden" id="alt-note"></div>
            </div>

            <!-- Grammar chip + Listen (shown after answer) -->
            <div class="post-feedback-row">
                <div id="grammar-chip-wrap" class="grammar-chip-wrap hidden">
                    <a id="grammar-chip" class="grammar-chip" href="../../grammar/html/grammar.html" aria-label="Abrir Taller de Gramática para esta regla" data-i18n-aria="grammar_chip_aria">
                        📐 <span id="grammar-chip-label"></span> →
                    </a>
                </div>
                <button class="listen-btn hidden" id="listen-btn" data-i18n="listen_btn_label"></button>
            </div>

            <!-- Next / Try Again -->
            <div class="action-row" id="action-row">
                <button class="next-btn hidden" id="next-btn" aria-label="Continuar a la siguiente frase" data-i18n-aria="next_btn_aria" data-i18n="btn_next"></button>
                <button class="try-again-btn hidden" id="try-again-btn" aria-label="Intentar esta frase de nuevo" data-i18n-aria="try_again_phrase_aria" data-i18n="btn_try_again"></button>
            </div>

        </div>

    </main>
