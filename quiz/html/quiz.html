    <main class="quiz-page" id="main-content">

        <!-- Topic Picker (shown first) -->
        <div id="topic-picker">
            <div class="topic-picker-header">
                <h1 data-i18n-html="quiz_page_title"></h1>
                <p data-i18n="quiz_picker_sub"></p>
            </div>
            <div class="topic-grid" id="topic-grid"></div>
        </div>

        <!-- Quiz Content (hidden until topic selected) -->
        <div id="quiz-content" class="hidden">

            <!-- Session bar -->
            <div class="session-info-bar">
                <button class="back-btn" id="back-btn" aria-label="Volver al selector de temas" data-i18n-aria="back_to_topics_aria" data-i18n="back_to_topics"></button>
                <span id="quiz-counter" class="session-counter" role="status" aria-live="polite"></span>
                <span class="streak-badge" id="quiz-streak"></span>
            </div>
            <div class="session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="session-progress-fill" id="session-progress-fill"></div></div>

            <!-- Word card -->
            <div class="word-card" id="word-card">
                <span class="word-category-badge" id="quiz-category"></span>
                <div class="quiz-word" id="quiz-word">—</div>
            </div>

            <!-- Answer choices -->
            <div class="choices-grid" id="choices-grid" role="group" aria-label="Opciones de definición" data-i18n-aria="choices_grid_aria">
                <!-- Filled by JS -->
            </div>

            <!-- Feedback panel (hidden until answered) -->
            <div class="quiz-feedback hidden" id="quiz-feedback" role="status" aria-live="polite">
                <p class="feedback-result" id="feedback-result"></p>
                <div id="quiz-diff"></div>
                <div class="feedback-divider" id="feedback-divider"></div>
                <div class="feedback-note" id="feedback-example">
                    <span class="feedback-note-icon">💬</span>
                    <span class="feedback-note-text" id="feedback-example-text"></span>
                </div>
            </div>

            <!-- Next / Try Again (shown after answer) -->
            <div class="action-row" id="action-row">
                <button class="next-btn hidden" id="next-btn" aria-label="Continuar a la siguiente pregunta" data-i18n-aria="next_question_aria" data-i18n="btn_next"></button>
                <button class="try-again-btn hidden" id="try-again-btn" aria-label="Intentar esta pregunta de nuevo" data-i18n-aria="try_again_question_aria" data-i18n="btn_try_again"></button>
            </div>

        </div>

    </main>
