name: Content checks

# Validates content quality on every push and pull request to main.
# Runs the same audits used locally (check-content + audit) so broken
# schema, anglicisms, punctuation, ID collisions, over-long slugs, etc.
# are caught before they reach the published site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: the validators only read JSON + tool scripts, so we
      # skip the ~400 MB of audio for a fast, cheap run.
      - name: Checkout (JSON + tools only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shared/json
            tools
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both scripts use only Node built-ins — no npm install needed.
      - name: Content rule checks (check-content.mjs)
        run: node tools/check-content.mjs

      - name: Content audit (audit.mjs --quick)
        run: node tools/audit.mjs --quick

  # Core-vocabulary rule (TWO CHANNELS): the target language must teach ≥ 90% of the
  # pedagogical top-1000 with PHRASES alone AND with VOCAB alone — the core taught
  # both in context (phrases) and in isolation (vocab). Phrases are measured over the
  # full teachable top-1000; vocab over content words only (closed-class function
  # words are excluded — they cannot be flashcards). Premise: the ~1000 most frequent
  # units cover ~88% of everyday speech. English uses NGSL (committed). Spanish uses
  # ELELex (CC BY-NC-SA, not committed) so its gate runs LOCALLY only — see
  # coverage.mjs. This job is a visible signal, not (yet) a required check: coverage
  # is being raised toward the target. Make it required in branch protection once green.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (JSON + tools only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shared/json
            tools
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Core-vocabulary coverage gate (EN, NGSL top-1000 >= 90% in BOTH channels)
        run: node tools/coverage.mjs --pair es-en --gate --min 90
