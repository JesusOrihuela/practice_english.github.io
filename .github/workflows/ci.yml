name: Content checks

# Validates content quality on every push and pull request to main.
# Runs the same audits used locally (check-content + audit) so broken
# schema, anglicisms, punctuation, ID collisions, over-long slugs, etc.
# are caught before they reach the published site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: the validators only read JSON + tool scripts, so we
      # skip the ~400 MB of audio for a fast, cheap run. shared/js is needed
      # because fix-phrase-ids.js --check reads shared/js/progress.js (the _ID_MAP).
      - name: Checkout (JSON + JS + tools only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shared/json
            shared/js
            tools
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both scripts use only Node built-ins — no npm install needed.
      - name: Content rule checks (check-content.mjs)
        run: node tools/check-content.mjs

      - name: Content audit (audit.mjs --quick)
        run: node tools/audit.mjs --quick

      # Grammar↔phrase evidence: (a) every rule's `topics` must equal the topics
      # whose phrases exercise the structure, and (b) grammar-phrase-rules.json (the
      # per-phrase rule map that drives the learning-mode grammar chip) must match
      # the detectors. Both are re-derived from phrase evidence; fails on any drift
      # (run grammar-topics.mjs --write to regenerate both).
      - name: Grammar topics + phrase-rule map reflect evidence (grammar-topics.mjs --check)
        run: node tools/grammar-topics.mjs --check

      # Mi Aprendizaje path completeness: _ID_MAP in progress.js (the topic→phraseIds /
      # vocabIds lookup the path session builder reads) must match the content. Derived
      # from topics.json + the vocab files, so a new category/phrase/word flows in
      # automatically — this fails the build if progress.js was not regenerated, which
      # would otherwise silently drop that content from every learner's path.
      - name: Path ID map reflects content (fix-phrase-ids.js --check)
        run: node tools/fix-phrase-ids.js --check

      # Every target language a pair learns must have a COMPLETE linguistic profile
      # (shared/js/lang-profiles.js + tools/lang-detectors.mjs): accent-fold rule,
      # cloze stop-words, function words, grammar detectors, and tip→rule labels
      # whose rule ids exist. Turns "add a language" into "fill one profile or fail".
      - name: Language profiles complete (check-lang-profiles.mjs)
        run: node tools/check-lang-profiles.mjs

      # Category taxonomy (shared/json/common/category-scopes.json) is the single
      # source of truth for every category's scope; it must stay in sync with the
      # actual content (no orphan scopes, no unscoped category) and every phrase id
      # must respect its topic prefix. Anchors the semantic content-quality audit.
      - name: Category taxonomy conforms (check-taxonomy.mjs)
        run: node tools/check-taxonomy.mjs

  # Topic-card images: every (activity, topic) slot must have both jpg (1280×720)
  # and webp (800×450), correctly framed (no letterbox/pillarbox bar), sharp, unique
  # within an activity, present, and free of orphans. Verified by check-images.mjs +
  # img-probe.py (Pillow+numpy). Keeps the image set from silently regressing (wrong
  # dims, missing, duplicate, or bordered pictures). Relevance is audited separately
  # (audit-images.mjs, CLIP) — dev-time and advisory, so not part of the CI gate.
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (images + JS + tools)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cloze/img
            dictation/img
            quiz/img
            scramble/img
            speaking/img
            translation/img
            vocabulary/img
            shared/js
            shared/json/common
            tools
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow + numpy
        run: pip install --quiet pillow numpy
      - name: Topic images valid (check-images.mjs)
        run: node tools/check-images.mjs

  # i18n standard: no hardcoded UI text in HTML — every translatable element is
  # empty with a data-i18n* attribute, filled from lang/ui.js by AppI18nDom. This
  # job fails if any page hardcodes text or uses a key missing from a language block.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (HTML + lang + tools)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lang
            tools
            shared/json/pairs/es-en
            speaking/html
            dictation/html
            cloze/html
            translation/html
            scramble/html
            vocabulary/html
            quiz/html
            grammar/html
            my-learning/html
            progress/html
            placement/html
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: No hardcoded UI text + keys resolve (check-i18n.mjs)
        run: node tools/check-i18n.mjs

      # Accessibility gate: <html lang>, img alt, accessible names on controls/inputs,
      # no duplicate ids. Deterministic; complements the broad Lighthouse a11y audit.
      - name: Accessibility checks (check-a11y.mjs)
        run: node tools/check-a11y.mjs

  # Core-vocabulary rule (TWO CHANNELS): every target language must teach ≥ its floor of
  # the top-1000 core with PHRASES alone AND with VOCAB alone — the core taught both in
  # context (phrases) and in isolation (vocab). Runs for EVERY language (derived from the
  # pairs), each against a COMMITTED frequency index (frequency.gateIndex in lang-profiles:
  # NGSL for en, a lemmatized FrequencyWords core for es) with a per-language floor
  # (frequency.gateFloor). No "local only" per language: a language without a committed
  # index fails the gate. (Spanish's CEFR-graded ELELex is CC BY-NC-SA → local-only
  # reference, never the gate.) Floors are ratcheting regression guards kept a couple
  # points below live coverage, not comparable across languages (different yardsticks).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (JSON + JS + tools)
        uses: actions/checkout@v4
        with:
          # shared/js is needed because coverage.mjs imports the language-profile
          # registry (shared/js/lang-profiles.js) for function-word / ignore sets.
          sparse-checkout: |
            shared/json
            shared/js
            tools
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Gates ALL languages, each against its committed index at its per-language floor
      # (lang-profiles frequency.gateFloor). No --pair / --min → derives the pairs and
      # reads each floor from the profile.
      - name: Core-vocabulary coverage floor (every language, top-1000 in BOTH channels)
        run: node tools/coverage.mjs --gate

  # Browser smoke suite (tests/smoke.mjs): runs the app in headless Chromium and
  # checks the things static checks can't — the answer loop, feedback rendering,
  # the Enter-key regression, and that every page loads with no uncaught JS errors
  # (it already caught a missing script include on the placement page). Serves the
  # app itself (no audio needed), so it checks out everything except shared/audio.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (app, no audio)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index
            lang
            shared/js
            shared/css
            shared/json
            cloze
            dictation
            translation
            scramble
            vocabulary
            quiz
            grammar
            speaking
            my-learning
            progress
            placement
            tests
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (playwright-core)
        run: npm ci
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Browser smoke suite
        run: npm test
        env:
          PW_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PW_CHANNEL: chrome   # fallback if the action's path output is empty
