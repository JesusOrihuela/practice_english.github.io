name: Lighthouse

# Report-only performance/accessibility/best-practices/SEO audit of the live
# site, run automatically after every successful GitHub Pages deployment.
# Uses the same Lighthouse engine as pagespeed.web.dev. It does NOT block
# merges or deploys — it only reports, so scores can be tracked per change.
# Add assertions/thresholds later (see the commented block) once scores are
# stable enough to gate on.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  lighthouse:
    # Run only when a GitHub Pages deployment has just succeeded, so we audit
    # the freshly deployed site (not the previous one).
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      # Lighthouse audits the live URL, but LHCI needs a git checkout to read
      # the commit hash it tags the report with (deployment_status runs don't
      # check out by default). Shallow is enough.
      - name: Checkout (git context for the report)
        uses: actions/checkout@v4

      - name: Run Lighthouse (report-only)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://jesusorihuela.github.io/practice_english.github.io/
          runs: 3                     # median of 3 runs for stable numbers
          uploadArtifacts: true       # save the full HTML report as a run artifact
          temporaryPublicStorage: true # also print a shareable report link in the logs
          # To enforce thresholds later, add a budget/assertions file and reference it:
          # budgetPath: ./.github/lighthouse-budget.json
