name: Lighthouse

# Performance/accessibility/best-practices/SEO audit of the live site, run
# automatically after every successful GitHub Pages deployment (same engine as
# pagespeed.web.dev). GATED via .github/lighthouserc.json:
#   - accessibility / best-practices: error @ 0.90, seo: error @ 0.95 — hard gates
#     (live scores 96/96/100 leave a safe margin; a red run = a real regression).
#   - performance: WARN @ 0.90 — a shift-left nudge on every build under 90 without
#     false-failing. The free runner is ±8 pts noisy on TBT/LCP and picks up 3rd-party
#     ad/analytics from the test environment (rubicon/sephora/gamdom) that the app's CSP
#     forbids; live mobile is ~87-90, so a hard 0.90 perf gate would flake constantly.
#     Use pagespeed.web.dev (incognito) for the authoritative number.
# Post-deploy, so a red run flags a regression to fix — it doesn't block the deploy.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  lighthouse:
    # Run only when a GitHub Pages deployment has just succeeded, so we audit
    # the freshly deployed site (not the previous one).
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      # Lighthouse audits the live URL, but LHCI needs a git checkout to read
      # the commit hash it tags the report with (deployment_status runs don't
      # check out by default). Shallow is enough.
      - name: Checkout (git context for the report)
        uses: actions/checkout@v5

      - name: Run Lighthouse (report-only)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://jesusorihuela.github.io/practice_english.github.io/
          runs: 3                     # median of 3 runs for stable numbers
          uploadArtifacts: true       # save the full HTML report as a run artifact
          temporaryPublicStorage: true # also print a shareable report link in the logs
          configPath: ./.github/lighthouserc.json  # per-category minimum-score assertions (gate)
