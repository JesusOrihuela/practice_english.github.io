    <main id="main-content">

        <!-- Topic Picker (shown first) -->
        <div id="topic-picker">
            <div class="topic-picker-header">
                <h1 data-i18n-html="vocab_page_title"></h1>
                <p data-i18n="vocab_picker_sub">Elige un tema, voltea cada tarjeta para ver su significado y califica qué tan bien la conoces.</p>
            </div>
            <div class="topic-grid" id="topic-grid"></div>
        </div>

        <!-- Vocab Content (hidden until topic selected) -->
        <div id="vocab-content" class="hidden">

            <!-- Stats Bar -->
            <div class="session-info-bar">
                <button class="back-btn" id="back-btn" aria-label="Volver al selector de temas" data-i18n-aria="back_to_topics_aria" data-i18n="back_to_topics"></button>
                <span id="cards-remaining" class="session-counter" role="status" aria-live="polite"></span>
                <span class="streak-badge" id="vocab-streak"><span aria-hidden="true">🔥</span> Racha de 0 día(s)</span>
            </div>
            <div class="session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="session-progress-fill" id="session-progress-fill"></div></div>

            <!-- Flashcard -->
            <div class="flashcard-scene" id="flashcard-scene" role="button" tabindex="0" aria-label="Flashcard — press Enter or Space to flip" data-i18n-aria="flashcard_flip_aria">
                <div class="flashcard" id="flashcard">

                    <!-- Front: word -->
                    <div class="flashcard-face flashcard-front" id="flashcard-front">
                        <div class="fc-front-top">
                            <span class="word-category" id="word-category"></span>
                        </div>
                        <div class="word-text" id="word-text">—</div>
                        <button class="listen-btn" id="listen-btn" aria-label="Escuchar pronunciación" data-i18n-aria="listen_pronunciation_aria">🔊 Escuchar</button>
                        <div class="flip-hint" data-i18n="flip_hint">Ver significado</div>
                    </div>

                    <!-- Back: definition + example + translation -->
                    <div class="flashcard-face flashcard-back" id="flashcard-back">
                        <div class="fc-back-word" id="fc-back-word"></div>
                        <button class="listen-btn listen-btn-back" id="listen-btn-back" aria-label="Escuchar pronunciación" data-i18n-aria="listen_pronunciation_aria">🔊 Escuchar</button>
                        <div class="fc-definition-block">
                            <span class="fc-label" data-i18n="fc_definition_label">Definición</span>
                            <div class="word-definition" id="word-definition"></div>
                        </div>
                        <div class="fc-divider"></div>
                        <div class="fc-example-block">
                            <span class="fc-label" data-i18n="fc_example_label">Ejemplo</span>
                            <div class="word-example" id="word-example"></div>
                        </div>
                        <div class="fc-translation-block">
                            <span class="fc-label" data-i18n="fc_spanish_label">Español</span>
                            <div class="word-translation" id="word-translation"></div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Next button (appear after flip) -->
            <button class="next-btn hidden" id="next-btn" aria-label="Continuar a la siguiente palabra" data-i18n-aria="next_word_aria" data-i18n="btn_next"></button>

        </div>

    </main>
