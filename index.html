    <!-- Load the font stylesheet without blocking render: fetch it early (preload),

    <!-- i18n cloak: the landing carries no hardcoded UI text — every element is
         empty (data-i18n) and filled by _initMainPageI18n() at end of body, for
         ALL pairs. Hide the page until it's filled so no empty content is painted;
         reveal on DOMContentLoaded (after that runs), with a 2 s failsafe.
         generalities.css (loaded above) defines html.lang-cloak body{visibility:hidden}. -->
    <script>
    (function () {
      try {
        var de = document.documentElement;
        de.classList.add('lang-cloak');
        var reveal = function () { de.classList.remove('lang-cloak'); };
        document.addEventListener('DOMContentLoaded', reveal);
        setTimeout(reveal, 2000);
      } catch (e) {}
    })();
    </script>

    <script>
      /* ── Pair Selection + Onboarding Modal + Embedded Placement Quiz ── */
      (function () {

        // ── Group 0: Show pair picker on very first visit ─────────────
        if (!localStorage.getItem('pe_active_pair')) {
          _initMainPageI18n(); // translate background using navigator.language
          _showPairPicker();
          return;
        }

        // ── Translate main page content for English-source pairs ──────
        _initMainPageI18n();

        // ── Background model preload ────────────────────────────────
        // Start caching TTS + STT models as soon as the pair is confirmed.
        // Guards on localStorage keys set by AppDownloadPanel.complete() — no
        // Worker is created on repeat visits when models are already cached.
        if (typeof AppTTS !== 'undefined' && !localStorage.getItem('pe_tts_cached')) {
          AppTTS.warmup();
        }
        function _startSttWarmup() {
          try {
            var _sttDp = (typeof AppDownloadPanel !== 'undefined' && typeof AppLang !== 'undefined')
              ? AppDownloadPanel.create(AppLang.t('stt_loading'), AppLang.t('stt_ready'), 'pe_stt_cached')
              : null;
            var _sttWu = new Worker('shared/js/stt-worker.js', { type: 'module' });
            _sttWu.onmessage = function (e) {
              if (!e.data) return;
              if (e.data.type === 'progress' && e.data.progress != null && _sttDp) _sttDp.update(e.data.progress);
              if (e.data.type === 'ready') {
                if (_sttDp) _sttDp.complete(); else localStorage.setItem('pe_stt_cached', '1');
                _sttWu.terminate();
              }
            };
            _sttWu.onerror = function () { if (_sttDp) _sttDp.hide(); _sttWu.terminate(); };
          } catch (e) {}
        }
        // Validate Cache API before trusting the localStorage flag: if
        // transformers-cache was evicted, clear the stale flag so the
        // download panel shows on the next warmup.
        function _maybeStartSttWarmup() {
          if ('caches' in window) {
            caches.open('transformers-cache')
              .then(function (c) { return c.keys(); })
              .then(function (keys) {
                if (keys.length === 0) localStorage.removeItem('pe_stt_cached');
                if (!localStorage.getItem('pe_stt_cached')) _startSttWarmup();
              })
              .catch(function () {
                if (!localStorage.getItem('pe_stt_cached')) _startSttWarmup();
              });
          } else {
            if (!localStorage.getItem('pe_stt_cached')) _startSttWarmup();
          }
        }
        // Defer the ~41 MB STT model preload until the page is interactive so it
        // does not compete with first paint / LCP during the critical load window.
        // The model still warms up in the background — just after the page is usable.
        if ('requestIdleCallback' in window) {
          requestIdleCallback(_maybeStartSttWarmup, { timeout: 4000 });
        } else {
          window.addEventListener('load', function () { setTimeout(_maybeStartSttWarmup, 1500); });
        }

        if (localStorage.getItem(AppLangPair.storageKey('pe_onboarded'))) return;

        // ── Placement questions (from shared/json/common/placement-questions.json) ──
        // To add a new language pair: add a key matching the pair id in the JSON.
        var QUESTIONS = null;
        fetch('shared/json/common/placement-questions.json')
          .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function(data) {
            var pairId = AppLangPair.getActive().id;
            QUESTIONS = data[pairId] || data['es-en'] || [];
          })
          .catch(function() { QUESTIONS = []; });

        var overlay = document.getElementById('ob-overlay');
        var quizIdx = 0, quizScore = 0, quizAnswered = false;

        function show() {
          var step0Title = document.querySelector('#ob-step-0 .ob-title');
          var step0Body  = document.querySelector('#ob-step-0 .ob-body');
          var step0Btn   = document.getElementById('ob-next-0');
          if (step0Title) step0Title.textContent = AppLang.t('ob_title_how', { target: AppLangPair.getActive().target.localName, targetName: AppLangPair.getActive().target.name });
          if (step0Body)  step0Body.innerHTML    = AppLang.t('ob_body_how');
          if (step0Btn)   step0Btn.textContent   = AppLang.t('ob_btn_find_level');
          var step1Title = document.querySelector('#ob-step-1 .ob-title');
          var step1Body  = document.querySelector('#ob-step-1 .ob-body');
          var step1Btn   = document.getElementById('ob-topics-done');
          if (step1Title) step1Title.textContent = AppLang.t('ob_title_topics');
          if (step1Body)  step1Body.textContent  = AppLang.t('ob_body_topics');
          if (step1Btn)   step1Btn.textContent   = AppLang.t('ob_btn_topics_done');
          var skipBtn = document.getElementById('ob-quiz-skip');
          if (skipBtn) skipBtn.textContent = AppLang.t('ob_quiz_skip');
          var manualLabel = document.querySelector('.ob-quiz-manual-label');
          if (manualLabel) manualLabel.textContent = AppLang.t('ob_manual_label');
          // Manual level buttons
          document.querySelectorAll('.ob-manual-btn').forEach(function(btn) {
            var lvl = btn.getAttribute('data-level');
            var _LEVEL_KEYS = { A1: 'manual_level_beginner', B1: 'manual_level_intermediate', C1: 'manual_level_advanced' };
            if (_LEVEL_KEYS[lvl]) btn.innerHTML = AppLang.t(_LEVEL_KEYS[lvl]);
          });
          var step3Title = document.querySelector('#ob-step-3 .ob-title');
          var goPathBtn  = document.getElementById('ob-go-path');
          var goFreeBtn  = document.getElementById('ob-go-free');
          if (step3Title) step3Title.textContent = AppLang.t('ob_title_done');
          if (goPathBtn)  goPathBtn.textContent  = AppLang.t('ob_btn_go_path');
          if (goFreeBtn)  goFreeBtn.textContent  = AppLang.t('ob_btn_explore');
          overlay.classList.remove('hidden');
          document.getElementById('ob-close').focus();
        }

        function dismiss() {
          localStorage.setItem(AppLangPair.storageKey('pe_onboarded'), '1');
          if (typeof AppProficiency !== 'undefined') AppProficiency.initDefault();
          overlay.classList.add('ob-out');
          setTimeout(function () { overlay.classList.add('hidden'); }, 280);
        }

        function goStep(n) {
          document.querySelectorAll('.ob-step').forEach(function (el) { el.classList.add('hidden'); });
          document.getElementById('ob-step-' + n).classList.remove('hidden');
          document.querySelectorAll('.ob-dot').forEach(function (dot, i) {
            dot.classList.toggle('active', i === n);
          });
        }

        function scoreToLevel(s) {
          if (s <= 3)  return 'A1';
          if (s <= 6)  return 'A2';
          if (s <= 9)  return 'B1';
          if (s <= 11) return 'B2';
          if (s <= 13) return 'C1';
          return 'C2';
        }

        var _isEnSrc = AppLangPair.getActive().source.code === 'en';
        var LEVEL_LABEL = _isEnSrc
          ? { A1: 'A1 — Beginner', A2: 'A2 — Elementary', B1: 'B1 — Intermediate', B2: 'B2 — Upper Intermediate', C1: 'C1 — Advanced', C2: 'C2 — Mastery' }
          : { A1: 'A1 — Principiante', A2: 'A2 — Elemental', B1: 'B1 — Intermedio', B2: 'B2 — Avanzado', C1: 'C1 — Competente', C2: 'C2 — Maestría' };

        function _finishPlacement(level) {
          localStorage.setItem(AppLangPair.storageKey('pe_placement_done'), 'done');
          localStorage.setItem(AppLangPair.storageKey('pe_placement_level'), level);
          if (typeof AppProficiency !== 'undefined') AppProficiency.initFromManual(level);
          var msg = document.getElementById('ob-welcome-msg');
          if (msg) {
            msg.textContent = AppLang.t('ob_welcome_msg', { level: LEVEL_LABEL[level] || level });
          }
          goStep(3);
        }

        function showQuestion(i) {
          var q = QUESTIONS[i];
          var pct = (i / QUESTIONS.length) * 100;
          document.getElementById('ob-quiz-fill').style.width = pct + '%';
          document.getElementById('ob-quiz-bar').setAttribute('aria-valuenow', Math.round(pct));
          document.getElementById('ob-quiz-counter').textContent = AppLang.t('placement_counter', { n: i + 1, total: QUESTIONS.length });
          document.getElementById('ob-quiz-lvbadge').textContent = q.level;
          document.getElementById('ob-quiz-q').textContent = q.q;
          var optsEl = document.getElementById('ob-quiz-opts');
          optsEl.innerHTML = '';
          quizAnswered = false;
          q.options.forEach(function (opt, idx) {
            var btn = document.createElement('button');
            btn.className = 'ob-opt-btn';
            btn.textContent = opt;
            btn.setAttribute('role', 'listitem');
            btn.addEventListener('click', function () { selectOption(idx); });
            optsEl.appendChild(btn);
          });
        }

        function selectOption(idx) {
          if (quizAnswered) return;
          quizAnswered = true;
          var q = QUESTIONS[quizIdx];
          var correct = idx === q.answer;
          if (correct) quizScore++;
          if (typeof AppProficiency !== 'undefined') AppProficiency.update(q.level, correct, 'quiz', true);
          document.querySelectorAll('.ob-opt-btn').forEach(function (b, i) {
            b.disabled = true;
            if (i === q.answer) b.classList.add('ob-opt-btn--correct');
            if (i === idx && !correct) b.classList.add('ob-opt-btn--wrong');
          });
          setTimeout(function () {
            quizIdx++;
            if (quizIdx < QUESTIONS.length) {
              showQuestion(quizIdx);
            } else {
              document.getElementById('ob-quiz-fill').style.width = '100%';
              _finishPlacement(scoreToLevel(quizScore));
            }
          }, 850);
        }

        document.getElementById('ob-close').addEventListener('click', dismiss);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) dismiss(); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !overlay.classList.contains('hidden')) dismiss();
        });

        document.getElementById('ob-next-0').addEventListener('click', function () {
          renderTopicBubbles();
          goStep(1);
        });

        function renderTopicBubbles() {
          var container = document.getElementById('ob-topic-bubbles');
          if (container.children.length) return;
          (typeof AppTopics !== 'undefined' ? AppTopics.PHRASE_TOPICS : []).forEach(function (t) {
            var btn = document.createElement('button');
            btn.className = 'ob-bubble';
            btn.type = 'button';
            var _label = (_isEnSrc && t.labelEn) ? t.labelEn : t.label;
            btn.textContent = t.emoji + ' ' + _label;
            btn.dataset.id = t.id;
            btn.addEventListener('click', function () { btn.classList.toggle('ob-bubble--on'); });
            container.appendChild(btn);
          });
        }

        document.getElementById('ob-topics-done').addEventListener('click', function () {
          var on = Array.from(document.querySelectorAll('#ob-topic-bubbles .ob-bubble--on'))
                       .map(function (b) { return b.dataset.id; });
          localStorage.setItem(AppLangPair.storageKey('pe_topic_preferences'), JSON.stringify(on));
          quizIdx = 0; quizScore = 0;
          showQuestion(0);
          goStep(2);
        });

        document.getElementById('ob-quiz-skip').addEventListener('click', function () {
          ['ob-quiz-meta', 'ob-quiz-bar', 'ob-quiz-q', 'ob-quiz-opts', 'ob-quiz-skip'].forEach(function (id) {
            document.getElementById(id).classList.add('hidden');
          });
          document.getElementById('ob-quiz-manual').classList.remove('hidden');
        });

        document.querySelectorAll('.ob-manual-btn').forEach(function (btn) {
          btn.addEventListener('click', function () { _finishPlacement(btn.dataset.level); });
        });

        document.getElementById('ob-go-path').addEventListener('click', function () {
          dismiss();
          window.location.href = 'my-learning/html/my-learning.html';
        });
        document.getElementById('ob-go-free').addEventListener('click', dismiss);

        setTimeout(show, 700);

        // ── Main page i18n (translates static HTML for non-es source) ──
        function _initMainPageI18n() {
          if (typeof AppI18nDom === 'undefined') return;
          // Fill every data-i18n* element (landing + onboarding) from AppLang,
          // for ALL pairs — no hardcoded UI text in the HTML (project standard).
          AppI18nDom.apply(document, AppI18nDom.params());

          // Footer: invariant name + translatable "developed by" + dynamic year.
          var fp = document.querySelector('footer .footer-content p');
          if (fp && typeof AppLang !== 'undefined') {
            var dev = AppLang.t('footer_developed_by');
            if (dev !== 'footer_developed_by') {
              fp.innerHTML = '© <span id="footer-year">' + new Date().getFullYear() + '</span> ' + dev + ' Jesús Orihuela';
            }
          }
        }

        // ── Pair picker (shown when pe_active_pair === null) ──────────
        function _showPairPicker() {
          var _PICKER_UI = {
            en: { title: 'What language do you want to learn?',       subtitle: 'Choose your learning path'            },
            es: { title: '¿Qué idioma quieres aprender?',             subtitle: 'Elige tu ruta de aprendizaje'         },
            fr: { title: 'Quelle langue veux-tu apprendre ?',         subtitle: 'Choisis ton parcours d\'apprentissage' },
            pt: { title: 'Qual idioma você quer aprender?',           subtitle: 'Escolha seu caminho de aprendizagem'  },
            de: { title: 'Welche Sprache möchtest du lernen?',        subtitle: 'Wähle deinen Lernpfad'                },
            it: { title: 'Quale lingua vuoi imparare?',               subtitle: 'Scegli il tuo percorso'               },
            nl: { title: 'Welke taal wil je leren?',                  subtitle: 'Kies je leertraject'                  },
            pl: { title: 'Jakiego języka chcesz się nauczyć?',        subtitle: 'Wybierz swoją ścieżkę nauki'          },
            cs: { title: 'Jaký jazyk se chceš naučit?',              subtitle: 'Zvol si svou vzdělávací cestu'         },
            sv: { title: 'Vilket språk vill du lära dig?',            subtitle: 'Välj din inlärningsväg'               },
            da: { title: 'Hvilket sprog vil du lære?',                subtitle: 'Vælg din læringssti'                  },
            no: { title: 'Hvilket språk vil du lære?',                subtitle: 'Velg din læringsvei'                  },
            fi: { title: 'Minkä kielen haluat oppia?',                subtitle: 'Valitse oppimispolkusi'               },
            lv: { title: 'Kādu valodu tu gribi mācīties?',             subtitle: 'Izvēlies savu mācību ceļu'             },
            lt: { title: 'Kokios kalbos nori išmokti?',                subtitle: 'Pasirink savo mokymosi kelią'          },
            et: { title: 'Millist keelt soovid õppida?',               subtitle: 'Vali oma õpitee'                       },
          };
          var _navCode = (navigator.language || 'en').toLowerCase().split('-')[0];
          var _lang  = _PICKER_UI[_navCode] ? _navCode : 'en';
          var _s     = _PICKER_UI[_lang];
          var _pairs = AppLangPair.getAll();

          var picker = document.createElement('div');
          picker.id  = 'lp-picker';
          picker.className = 'ob-overlay';
          picker.setAttribute('role', 'dialog');
          picker.setAttribute('aria-modal', 'true');
          picker.setAttribute('aria-label', _s.title);

          var modal = document.createElement('div');
          modal.className = 'ob-modal';

          var inner = document.createElement('div');
          inner.className = 'ob-inner';

          var icon = document.createElement('div');
          icon.className = 'ob-hero-icon';
          icon.textContent = '🌍';
          inner.appendChild(icon);

          var title = document.createElement('h2');
          title.className = 'ob-title';
          title.id = 'ob-title';
          title.textContent = _s.title;
          inner.appendChild(title);

          var sub = document.createElement('p');
          sub.className = 'ob-body ob-body--sm';
          sub.textContent = _s.subtitle;
          inner.appendChild(sub);

          var cards = document.createElement('div');
          cards.className = 'lp-picker-cards';

          _pairs.forEach(function (pair) {
            var card = document.createElement('button');
            card.type = 'button';
            card.className = 'lp-picker-card';
            card.setAttribute('aria-label', pair.label);
            if (pair.source.code === _lang) card.classList.add('lp-picker-card--suggested');

            if (typeof AppFlags !== 'undefined') {
              card.appendChild(AppFlags.langFlags(pair.source.flags));
              var arrow = document.createElement('span');
              arrow.className = 'lp-picker-card__arrow';
              arrow.setAttribute('aria-hidden', 'true');
              arrow.textContent = '→';
              card.appendChild(arrow);
              card.appendChild(AppFlags.langFlags(pair.target.flags));
            }

            var label = document.createElement('span');
            label.className = 'lp-picker-card__label';
            label.textContent = pair.label;
            card.appendChild(label);

            card.addEventListener('click', function () {
              AppLangPair.setActive(pair.id);
              location.reload();
            });

            cards.appendChild(card);
          });

          inner.appendChild(cards);

          var stripe = document.createElement('div');
          stripe.className = 'ob-footer-stripe';
          stripe.setAttribute('aria-hidden', 'true');

          modal.appendChild(inner);
          modal.appendChild(stripe);
          picker.appendChild(modal);
          document.body.appendChild(picker);

          var firstCard = picker.querySelector('.lp-picker-card');
          if (firstCard) setTimeout(function () { firstCard.focus(); }, 50);
        }
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        // Automatic updates — mirrors shared/js/sw-register.js (root path here).
        // Only reload on a real update (a controller already existed), never on
        // first install. updateViaCache:'none' detects a new SW on the next
        // navigation instead of up to 24h later.
        const _hadController = !!navigator.serviceWorker.controller;
        let _refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!_hadController || _refreshing) return;
          _refreshing = true;
          location.reload();
        });
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
          .then(reg => {
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'activated' && _hadController && !_refreshing) {
                  _refreshing = true;
                  location.reload();
                }
              });
            });
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(() => {});
            });
          })
          .catch(() => {});
        // Fire daily reminder if conditions are met (once per day, after configured time)
        if (window.NotificationSystem) window.NotificationSystem.checkAndNotify();
      }
    </script>
